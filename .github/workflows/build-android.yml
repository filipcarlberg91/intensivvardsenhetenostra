name: Build Android Play Store (.aab) & APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Install dependencies & Build Web App (Build Mode)
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android Package com.iva.ostra, minSdk 24, targetSdk/compileSdk 36 & Permissions
        run: |
          node -e '
            const fs = require("fs");

            // 1. Update android/variables.gradle to minSdkVersion = 24, compileSdkVersion = 36, targetSdkVersion = 36
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/g, "minSdkVersion = 24");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/g, "compileSdkVersion = 36");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/g, "targetSdkVersion = 36");
              fs.writeFileSync(varsPath, vars, "utf8");
              console.log("Updated android/variables.gradle:\n" + vars);
            }

            // 2. Suppress unsupported compileSdk warning in android/gradle.properties
            const propsPath = "android/gradle.properties";
            if (fs.existsSync(propsPath)) {
              let props = fs.readFileSync(propsPath, "utf8");
              if (!props.includes("android.suppressUnsupportedCompileSdk")) {
                props += "\nandroid.suppressUnsupportedCompileSdk=35,36\n";
                fs.writeFileSync(propsPath, props, "utf8");
              }
            }

            // 3. Update android/app/build.gradle applicationId, versionCode, versionName, minSdk 24, compileSdk 36, targetSdk 36
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const runNum = parseInt(process.env.GITHUB_RUN_NUMBER || "4", 10);
            const versionCode = 100 + runNum;
            const versionName = "1.0." + runNum;
            gradle = gradle.replace(/applicationId\s+"[^"]+"/g, "applicationId \"com.iva.ostra\"");
            gradle = gradle.replace(/namespace\s+"[^"]+"/g, "namespace \"com.iva.ostra\"");
            gradle = gradle.replace(/compileSdk\s+rootProject\.ext\.compileSdkVersion/g, "compileSdk 36");
            gradle = gradle.replace(/compileSdkVersion\s+rootProject\.ext\.compileSdkVersion/g, "compileSdkVersion 36");
            gradle = gradle.replace(/compileSdkVersion\s+\d+/g, "compileSdkVersion 36");
            gradle = gradle.replace(/minSdkVersion\s+rootProject\.ext\.minSdkVersion/g, "minSdkVersion 24");
            gradle = gradle.replace(/minSdkVersion\s+\d+/g, "minSdkVersion 24");
            gradle = gradle.replace(/targetSdkVersion\s+rootProject\.ext\.targetSdkVersion/g, "targetSdkVersion 36");
            gradle = gradle.replace(/targetSdkVersion\s+\d+/g, "targetSdkVersion 36");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + versionCode);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, "versionName \"" + versionName + "\"");
            fs.writeFileSync(gradlePath, gradle, "utf8");
            console.log("Configured Android applicationId=com.iva.ostra, minSdk=24, targetSdk=36, compileSdk=36, versionCode=" + versionCode);

            // 4. Also ensure minSdk 24, compileSdk 36, targetSdk 36 in capacitor submodules if hardcoded
            const otherGradles = [
              "android/capacitor-cordova-android-plugins/build.gradle",
              "node_modules/@capacitor/android/capacitor/build.gradle"
            ];
            for (const p of otherGradles) {
              if (fs.existsSync(p)) {
                let content = fs.readFileSync(p, "utf8");
                content = content.replace(/minSdkVersion\s+\d+/g, "minSdkVersion 24");
                content = content.replace(/compileSdkVersion\s+\d+/g, "compileSdkVersion 36");
                content = content.replace(/targetSdkVersion\s+\d+/g, "targetSdkVersion 36");
                fs.writeFileSync(p, content, "utf8");
              }
            }

            // 5. Inject AndroidManifest.xml permissions
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
            `;
            if (!xml.includes("android.permission.CAMERA")) {
              xml = xml.replace("</manifest>", perms + "\n</manifest>");
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '

      - name: Ensure Persistent Play Store Upload Keystore
        run: |
          mkdir -p android-keystore
          if [ ! -f "android-keystore/iva-upload-key.jks" ]; then
            echo "Generating new persistent Play Store Upload Keystore..."
            keytool -genkeypair -v \
              -keystore android-keystore/iva-upload-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias ivaostra \
              -storepass ivaostra2026 \
              -keypass ivaostra2026 \
              -dname "CN=IVA Ostra, OU=Intensivvardsenheten Ostra, O=SU, L=Goteborg, ST=VG, C=SE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android-keystore/iva-upload-key.jks
            git commit -m "Save persistent Android upload keystore for Google Play [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build & Sign Google Play App Bundle (.aab) & Direct APK (.apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../android-keystore/iva-upload-key.jks \
            -Pandroid.injected.signing.store.password=ivaostra2026 \
            -Pandroid.injected.signing.key.alias=ivaostra \
            -Pandroid.injected.signing.key.password=ivaostra2026

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../android-keystore/iva-upload-key.jks \
            -Pandroid.injected.signing.store.password=ivaostra2026 \
            -Pandroid.injected.signing.key.alias=ivaostra \
            -Pandroid.injected.signing.key.password=ivaostra2026

          cp app/build/outputs/bundle/release/*.aab ../IVA-Ostra-PlayStore-Test.aab
          cp app/build/outputs/apk/release/*.apk ../IVA-Ostra-Direct-Install.apk

      - name: Upload Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IVA-Ostra-Android-PlayStore-Build
          path: |
            IVA-Ostra-PlayStore-Test.aab
            IVA-Ostra-Direct-Install.apk

      - name: Publish to GitHub Releases (Play Store Test Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "IVA Östra v1.0.${{ github.run_number }} — Google Play Testapp (.aab, com.iva.ostra, API 36)"
          body: |
            ### 🏥 Intensivvårdsenheten Östra — Android Build (v1.0.${{ github.run_number }})
            - **Google Play Store (Intern testning):** Ladda ner **`IVA-Ostra-PlayStore-Test.aab`** och ladda upp under *Google Play Console → Testning → Intern testning*.
            - **Direktinstallation på Android-mobil:** Ladda ner **`IVA-Ostra-Direct-Install.apk`** direkt i telefonen.
            - **Package ID:** `com.iva.ostra`
            - **targetSdkVersion / compileSdkVersion:** `36` (API-nivå 36)
            - **minSdkVersion:** `24`
            - **Version Code:** `10${{ github.run_number }}`
            - **Integritetspolicy-URL (krävs i Play Console):** `https://filipcarlberg91.github.io/intensivvardsenhetenostra/privacy-policy.html`
          files: |
            IVA-Ostra-PlayStore-Test.aab
            IVA-Ostra-Direct-Install.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
